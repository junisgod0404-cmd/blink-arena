<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BLINK // ARENA</title><style>*{box-sizing:border-box}body{margin:0;background:#070e1d;color:#e9f2ff;font:15px system-ui,sans-serif;text-align:center}header{padding:16px;font-size:24px;font-weight:900;letter-spacing:3px;color:#77d9ff}.panel{margin:8px auto;max-width:900px;padding:14px;background:#101c31;border:1px solid #304767;border-radius:14px}input,select,button{background:#162b47;border:1px solid #487397;border-radius:9px;color:white;padding:11px;margin:4px;font:inherit}button{cursor:pointer;background:#156f9d}button:active{transform:scale(.97)}#arena{width:min(96vw,900px);aspect-ratio:900/520;touch-action:none;background:#091628;border:2px solid #36577c;border-radius:10px;display:block;margin:8px auto}#hud{min-height:24px}#controls{display:flex;justify-content:space-around;align-items:center;gap:10px;max-width:900px;margin:12px auto;touch-action:none}#pad{width:150px;height:150px;border-radius:50%;background:#152d49;position:relative;touch-action:none;border:2px solid #456c8e}#nub{position:absolute;width:52px;height:52px;border-radius:50%;background:#57b6e8;left:49px;top:49px;pointer-events:none}#buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}#buttons button{min-width:80px;min-height:55px}#message{color:#ffcf72;min-height:26px}small{color:#a6bbd2}#invite{word-break:break-all} @media(min-width:900px){#controls{max-width:600px}}</style></head><body><div style="padding:8px 12px"><a href="/" style="color:#e7c77e">← 모드 선택으로 돌아가기</a></div><header>BLINK // ARENA</header><div class="panel" id="lobby"><input id="name" placeholder="닉네임" maxlength="16" value="PLAYER"><select id="mode"><option value="duel">1:1 DUEL</option><option value="survival">2인 SURVIVAL</option></select><button id="create">방 만들기</button><input id="room" placeholder="방 코드" maxlength="5" style="width:110px"><button id="join">입장</button><div id="invite"></div><button id="ready" hidden>준비 완료</button><button id="share" hidden>초대 링크 공유</button><button id="qrbutton" hidden>QR코드 보기</button><div id="qrbox" hidden style="margin:12px auto;background:white;padding:12px;width:max-content;max-width:95%"><img id="qrimg" width="220" height="220" alt="초대 QR코드"></div></div><div id="hud">방을 만들어 시작하세요</div><canvas id="arena" width="900" height="520"></canvas><div id="message"></div><div id="controls"><div id="pad"><div id="nub"></div></div><div id="buttons"><button data-action="shoot">Q 발사</button><button data-action="dash">대시</button><button data-action="parry">패링</button></div></div><small>PC: WASD / 방향키 이동 · 마우스 조준 · 클릭/Q 발사 · Space 대시 · E 패링<br>모바일: 왼쪽 조이스틱 이동 · 경기장 터치 조준 · 오른쪽 버튼 사용</small><script src="/socket.io/socket.io.js"></script><script>
const s=io(),canvas=document.querySelector('#arena'),ctx=canvas.getContext('2d'),hud=document.querySelector('#hud'),msg=document.querySelector('#message'),invite=document.querySelector('#invite');let myId=null,room=null,state=null,aim={x:450,y:260},keys={up:false,down:false,left:false,right:false},fx=[];const $=id=>document.getElementById(id);const nickname=()=>$('name').value.trim()||'PLAYER';function joined(r){if(r.error){msg.textContent=r.error;return;}room=r.room;myId=r.id;$('ready').hidden=false;$('share').hidden=false;$('qrbutton').hidden=false;$('create').disabled=true;$('join').disabled=true;invite.textContent='방 코드: '+room+' · 친구에게 링크를 공유하세요';history.replaceState(null,'',location.pathname+'?room='+room);msg.textContent='친구가 들어오면 둘 다 준비를 눌러주세요.';}
$('qrbutton').onclick=()=>{const box=$('qrbox');box.hidden=!box.hidden;if(!box.hidden)$('qrimg').src='/qr.svg?url='+encodeURIComponent(location.href);};$('create').onclick=()=>s.emit('create',{name:nickname(),mode:$('mode').value},joined);$('join').onclick=()=>s.emit('join',{room:$('room').value,name:nickname()},joined);$('ready').onclick=()=>s.emit('ready');$('share').onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:'BLINK // ARENA',url});else{await navigator.clipboard.writeText(url);msg.textContent='초대 링크를 복사했어요!';}}catch(e){msg.textContent=url;}};const params=new URLSearchParams(location.search);if(params.get('mode')==='survival')$('mode').value='survival';const query=params.get('room');if(query)$('room').value=query.toUpperCase();s.on('state',v=>{state=v;const me=v.players.find(p=>p.id===myId);hud.textContent=v.players.map(p=>`${p.name}: ${'♥'.repeat(Math.max(0,p.hp))} ${p.ready?'✓':''}`).join('  VS  ')+' | '+(v.started?'진행 중':v.ended?'경기 종료':'대기 중');if(me){const remain=Math.max(0,Math.ceil((me.parryReady-Date.now())/1000));document.querySelector('[data-action="parry"]').textContent=remain?'패링 '+remain+'s':'패링';}});s.on('started',()=>msg.textContent='FIGHT!');s.on('finished',d=>{msg.textContent=d.winner?`승자: ${d.winner} · 새 게임은 새 방을 만들어주세요.`:'경기 종료';if(d.leaderboard.length)invite.textContent+=' | 랭킹: '+d.leaderboard.map(([n,w])=>n+' '+w+'승').join(', ');});s.on('notice',v=>msg.textContent=v);s.on('effect',e=>fx.push({...e,t:performance.now()}));
function coord(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*520}}canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')aim=coord(e)});canvas.addEventListener('pointerdown',e=>{aim=coord(e);if(e.pointerType==='mouse')s.emit('action','shoot')});const keymap={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};window.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(keymap[e.key]){keys[keymap[e.key]]=true;e.preventDefault();}if(e.repeat)return;if(e.key==='q'||e.key==='Q')s.emit('action','shoot');if(e.key==='e'||e.key==='E')s.emit('action','parry');if(e.code==='Space'){e.preventDefault();s.emit('action','dash');}});window.addEventListener('keyup',e=>{if(keymap[e.key])keys[keymap[e.key]]=false});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();s.emit('action',b.dataset.action)}));const pad=$('pad'),nub=$('nub');function movePad(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy)||1,x=dx/Math.max(len,1)*Math.min(len,55),y=dy/Math.max(len,1)*Math.min(len,55);nub.style.transform=`translate(${x}px,${y}px)`;keys.left=x< -14;keys.right=x>14;keys.up=y< -14;keys.down=y>14;}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);movePad(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))movePad(e)});function release(){keys={up:false,down:false,left:false,right:false};nub.style.transform='';}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);setInterval(()=>s.emit('input',{...keys,ax:aim.x,ay:aim.y}),40);
function draw(){requestAnimationFrame(draw);ctx.fillStyle='#091628';ctx.fillRect(0,0,900,520);ctx.strokeStyle='#17324c';ctx.lineWidth=1;for(let x=0;x<=900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,520);ctx.stroke()}for(let y=0;y<=520;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}if(!state)return;if(state.boss){ctx.fillStyle='#ffcd7c';ctx.beginPath();ctx.arc(state.boss.x,state.boss.y,19,0,Math.PI*2);ctx.fill()}for(const b of state.bullets){ctx.fillStyle=b.owner==='boss'?'#f5cb6c':'#7bd8ff';ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}state.players.forEach((p,i)=>{ctx.fillStyle=i?'#ff637d':'#5bd4ff';ctx.shadowBlur=16;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(p.name,p.x,p.y-26);if(Date.now()<p.parryUntil){ctx.strokeStyle='#ffda71';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,27,0,Math.PI*2);ctx.stroke()}});fx=fx.filter(f=>performance.now()-f.t<600);for(const f of fx){const t=(performance.now()-f.t)/600;ctx.strokeStyle=f.type==='perfect'?'#ffe18b':f.type==='hit'?'#ff5272':'#80cfff';ctx.lineWidth=5*(1-t);ctx.beginPath();ctx.arc(f.x,f.y,20+90*t,0,Math.PI*2);ctx.stroke();}}draw();
</script></body></html>
